<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易工作台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header class="masthead"><i class="masthead-orbit" aria-hidden="true"></i><div class="masthead-inner">
    <div><div class="eyebrow">TRADE IT EASY</div><h1>交易工作台</h1></div>
    <div class="masthead-actions"><a id="account-settings" class="private-label" href="/settings" hidden>账户设置</a><a class="private-label" href="/research/timing">ETF 择时研究 →</a></div>
  </div></header>
  <main>
    <div class="intro"><p>账户资产与策略持仓</p><div class="intro-status"><p id="status" role="status">正在加载…</p><button id="overview-retry" type="button" class="secondary-button" hidden>重试</button></div></div>
    <div id="app" hidden>
      <div id="status-bar" class="status-bar" hidden></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="账户与策略"></nav>
      <div id="quote-panel" class="quote-panel" hidden>
        <div class="quote-copy"><p id="quote-status" role="status" aria-live="polite"></p><p id="quote-message" class="quote-message" role="status" hidden></p><div id="quote-missing" hidden></div></div>
        <button id="quote-refresh" type="button" class="secondary-button">刷新估值</button>
      </div>
      <div id="account" role="tabpanel"></div>
      <section class="section reports-section" aria-labelledby="reports-title">
        <div class="section-heading"><h2 id="reports-title">最新报告</h2></div>
        <div class="report-shell">
          <div id="report-empty" class="empty" hidden>暂无报告</div>
          <div id="report-panel" class="report-panel" aria-label="报告正文">
            <div class="report-heading"><div><span id="report-kind" class="report-kind">报告</span><h3 id="report-name">正在准备报告</h3></div><time id="report-date"></time></div>
            <div id="report-reader" class="report-reader"><article id="report-content" class="report-prose" aria-busy="false"></article></div>
            <div id="report-actions" class="report-actions" hidden><button id="report-expand" type="button" class="text-button" aria-expanded="false" aria-controls="report-reader">展开全文 ↓</button></div>
          </div>
        </div>
      </section>
    </div>
    <dialog id="event-dialog" aria-labelledby="event-title">
      <form id="event-form">
        <div class="section-heading"><h2 id="event-title">记账</h2><button type="button" id="event-cancel" class="text-button">关闭</button></div>
        <p id="event-success" class="entry-success" role="status" hidden></p>
        <fieldset id="event-fields" class="entry-fields">
        <div class="entry-modes" aria-label="记账类别"><button type="button" data-entry-mode="trade">买卖成交</button><button type="button" data-entry-mode="cash">出入金 / 分红</button><button type="button" data-entry-mode="assign">持仓划转</button><button type="button" data-entry-mode="cash_transfer">现金划转</button></div>
        <div class="entry-grid">
          <label>记账类型<select name="side"><option value="buy">买入</option><option value="sell">卖出</option><option value="dividend">现金分红到账</option><option value="deposit">资金转入</option><option value="withdraw">资金转出</option><option value="assign">持仓划转</option><option value="cash_transfer">现金划转</option></select></label>
          <label>发生日期<input name="date" type="date" required></label>
          <label hidden>转出策略<select name="from_strategy" disabled></select></label>
          <label data-strategy-field>策略<select name="strategy" required></select></label>
          <label hidden>交易账户<select name="trading_account" disabled required></select></label>
          <label data-trade-field><span id="entry-code-label">证券代码</span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" list="entry-securities" autocomplete="off" required><datalist id="entry-securities"></datalist><span id="entry-security" class="field-hint"></span></label>
          <label id="entry-kind-field" hidden>标的类型<select name="kind" required disabled><option value="">请选择</option><option value="listed">场内证券</option><option value="fund">场外基金</option></select></label>
          <div data-trade-field>
            <label><span id="entry-qty-label">成交份额</span><input name="qty" type="number" min="1" step="1" required></label>
            <div id="entry-reference" class="entry-quantity-action" hidden><span id="entry-reference-qty" class="field-hint"></span><button type="button" id="entry-use-reference" class="text-button">带入建议份额</button></div>
            <button type="button" id="entry-all" class="text-button" hidden>全部卖出</button>
          </div>
          <label data-trade-field>成交均价 / 元<input name="price" type="number" min="0.000001" step="any" required></label>
          <label data-trade-field><span id="entry-fee-label">手续费 / 元</span><input name="fee" type="number" min="0" step="0.01"></label>
          <label data-cash-field hidden>到账 / 转出金额 / 元<input name="amount" type="number" min="0.01" step="0.01" required disabled></label>
        </div>
        <p id="entry-context" class="entry-preview" aria-live="polite"></p>
        <p id="event-preview" class="entry-preview" aria-live="polite" hidden></p>
        <p id="entry-validation" class="warning" role="status" hidden></p>
        <p id="entry-armed-note" class="warning" role="status" hidden></p>
        </fieldset>
        <p id="event-error" class="warning" role="alert" hidden></p>
        <div class="entry-footer"><button id="event-save" type="submit" class="primary-button">保存记账</button><button id="event-continue" type="submit" class="secondary-button">保存并继续</button><button id="event-refresh" type="button" class="secondary-button" hidden>刷新账户</button></div>
      </form>
    </dialog>
    <dialog id="fund-void-dialog" aria-labelledby="fund-void-title" aria-describedby="fund-void-order fund-void-impact">
      <form id="fund-void-form">
        <div class="section-heading"><h2 id="fund-void-title"></h2></div>
        <p id="fund-void-order" class="fund-void-order"></p>
        <p id="fund-void-impact" class="entry-preview"></p>
        <p id="fund-void-error" class="warning" role="alert" hidden></p>
        <div class="entry-footer"><button type="button" id="fund-void-cancel" class="secondary-button" autofocus>取消</button><button type="submit" id="fund-void-save" class="secondary-button fund-void-action">确认作废</button></div>
      </form>
    </dialog>
    <dialog id="fund-dialog" aria-labelledby="fund-title">
      <form id="fund-form">
        <div class="section-heading"><h2 id="fund-title">场外基金记账</h2><button id="fund-cancel" type="button" class="text-button">关闭</button></div>
        <p id="fund-help" class="subtle"></p>
        <fieldset id="fund-fields" class="entry-fields">
          <p id="fund-name" class="subtle" aria-live="polite" hidden></p>
          <p id="fund-quick-summary" class="subtle" hidden></p>
          <div class="entry-grid">
            <label>所属策略<select name="strategy" required></select></label>
            <label hidden>交易账户<select name="trading_account" disabled required></select></label>
            <label id="fund-code-field">基金代码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
            <label id="fund-record-day-field"><span id="fund-record-day-label">记账日期</span><input name="date" type="date" required></label>
            <label><span id="fund-amount-label">实际扣款 / 元</span><input name="amount" type="number" min="0.01" step="0.01" required></label>
            <label id="fund-qty-field"><span id="fund-qty-label">份额</span><input name="qty" type="number" min="0.000001" max="1000000000" step="0.000001" required></label>
          </div>
          <details id="fund-buy-tools">
            <summary id="fund-buy-tools-label">买入日与费用</summary>
            <div class="entry-grid">
              <label id="fund-fee-kind-field">申购费<select name="fee_kind"><option value="">选择费型</option><option value="none">免申购费</option><option value="rate">按比例</option><option value="fixed">固定金额</option></select></label>
              <label id="fund-fee-field" hidden><span id="fund-fee-label">实际费率 / %</span><input name="fee" type="number" min="0" step="any"></label>
              <label><span id="fund-nav-day-label">买入日</span><input name="nav_date" type="date"></label>
              <label id="fund-nav-field">单位净值 / 元<input name="nav" type="number" min="0.00000001" max="100000000" step="0.00000001"></label>
            </div>
            <button type="button" class="text-button" id="fund-fetch-nav">查该日净值</button>
            <button type="button" class="text-button" id="fund-recalc-qty" hidden>按净值重算份额</button>
          </details>
          <p id="fund-preview" class="entry-preview"></p>
        </fieldset>
        <p id="fund-error" class="warning" role="alert" hidden></p>
        <button type="submit" class="primary-button" id="fund-save">保存记账</button>
      </form>
    </dialog>
    <dialog id="dca-dialog" aria-labelledby="dca-title">
      <form id="dca-form">
        <div class="section-heading"><h2 id="dca-title">定投计划</h2><button id="dca-cancel" type="button" class="text-button">关闭</button></div>
        <p class="subtle">收盘任务于 18:30 按计划登记当天到期的扣款。历史漏记请先核对基金 App，再从每期记录补记。</p>
        <div id="dca-plans" class="table-wrap"></div>
        <section id="dca-installments" aria-labelledby="dca-installments-title" hidden></section>
        <fieldset id="dca-fields" class="entry-fields">
          <div class="section-heading"><h3 id="dca-form-title">添加计划</h3></div>
          <div class="entry-grid">
            <label>基金代码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><span id="dca-fund-name" class="field-hint"></span></label>
            <label>所属组合<select name="strategy" required></select></label>
            <label>每期金额 / 元<input name="amount" type="number" min="0.01" step="0.01" required></label>
            <label hidden>扣款账户<select name="trading_account" disabled></select></label>
            <label>扣款周期<select name="frequency"><option value="monthly">每月</option><option value="weekly">每周</option><option value="daily">每日（交易日）</option></select></label>
            <label id="dca-anchor-label">扣款日<select name="anchor"></select></label>
            <label>备注<input name="note" maxlength="50" placeholder="可选"></label>
          </div>
        </fieldset>
        <p id="dca-error" class="warning" role="alert" hidden></p>
        <button type="submit" class="primary-button" id="dca-save">保存计划</button>
      </form>
    </dialog>
    <dialog id="custody-dialog" aria-labelledby="custody-title">
      <form id="custody-form">
        <div class="section-heading"><h2 id="custody-title">账户间划转</h2><button class="text-button" type="button" name="cancel">关闭</button></div>
        <p class="subtle" id="custody-source"></p>
        <fieldset class="entry-fields"><div class="entry-grid">
          <label>转入账户<select name="target" required></select></label>
          <label><span id="custody-unit"></span><input type="number" name="quantity" required></label>
          <label>登记日期<input type="date" name="date" required></label>
        </div></fieldset>
        <p class="warning" role="alert" hidden></p>
        <button class="primary-button" type="submit">保存划转</button>
      </form>
    </dialog>
    <dialog id="adjust-dialog" aria-labelledby="adjust-title">
      <form id="adjust-form">
        <div class="section-heading"><h2 id="adjust-title">校准现金</h2><button class="text-button" type="button" name="cancel">关闭</button></div>
        <p class="subtle" id="adjust-source"></p>
        <fieldset class="entry-fields"><div class="entry-grid">
          <label>平台实际余额 / 元<input type="number" name="actual" min="0" step="0.01" required></label>
          <label>登记日期<input type="date" name="date" required></label>
          <input type="hidden" name="amount">
        </div><p id="adjust-difference" class="entry-preview" aria-live="polite" hidden></p></fieldset>
        <p class="warning" role="alert" hidden></p>
        <button class="primary-button" type="submit">保存校准</button>
      </form>
    </dialog>
    <dialog id="asset-class-dialog" aria-labelledby="asset-class-title">
      <form id="asset-class-form">
        <div class="section-heading"><h2 id="asset-class-title">设置资产类别</h2><button id="asset-class-cancel" type="button" class="text-button">关闭</button></div>
        <p id="asset-class-product" class="subtle"></p>
        <label>资产类别<select name="asset_class" required></select></label>
        <p class="subtle">现金类包含货币基金；同时投资股债的基金可选择混合。</p>
        <p id="asset-class-error" class="warning" role="alert" hidden></p>
        <button id="asset-class-save" type="submit" class="primary-button">保存分类</button>
      </form>
    </dialog>
    <dialog id="cash-dialog" aria-labelledby="cash-title">
      <form id="cash-form">
        <div class="section-heading"><h2 id="cash-title">分配现金</h2><button id="cash-cancel" type="button" class="text-button">关闭</button></div>
        <fieldset id="cash-fields" class="entry-fields">
        <p class="subtle">账户现金 <strong id="cash-total">—</strong> 元</p>
        <label id="cash-date-label" hidden>发生日期<input name="date" type="date"></label>
        <button id="cash-fill-target" type="button" class="text-button">按全部策略目标再平衡</button>
        <div id="cash-rebalance-preview" hidden></div>
        <div class="entry-grid" id="cash-strategies"></div>
        <p id="cash-remaining" class="entry-preview"></p>
        </fieldset><p id="cash-error" class="warning" role="alert" hidden></p>
        <button type="submit" class="primary-button">确认分配</button>
      </form>
    </dialog>
  </main>
</body>
</html>
