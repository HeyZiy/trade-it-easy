<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交易工作台</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="masthead-inner">
    <div><div class="eyebrow">TRADE IT EASY</div><h1>交易工作台</h1></div>
    <span class="private-label"><span></span> 个人账户</span>
  </div></header>
  <main>
    <div class="intro"><p>账户资产与策略持仓</p><p id="status" role="status">正在加载…</p></div>
    <div id="app" hidden>
      <nav class="tabs" id="tabs" role="tablist" aria-label="账户与策略"></nav>
      <div id="quote-panel" class="quote-panel" hidden>
        <div class="quote-copy"><p id="quote-status" role="status" aria-live="polite"></p><p id="quote-message" class="quote-message" role="status" hidden></p></div>
        <button id="quote-refresh" type="button" class="secondary-button">刷新估值</button>
      </div>
      <div id="account" role="tabpanel"></div>
      <section class="section reports-section" aria-labelledby="reports-title">
        <div class="section-heading"><h2 id="reports-title">最新报告</h2></div>
        <div class="report-shell">
          <div id="report-empty" class="empty" hidden>暂无报告</div>
          <div id="report-panel" class="report-panel" aria-label="报告正文">
            <div class="report-heading"><div><span id="report-kind" class="report-kind">报告</span><h3 id="report-name">正在准备报告</h3></div><time id="report-date"></time></div>
            <div id="report-reader" class="report-reader"><article id="report-content" class="report-prose" aria-busy="false"></article></div>
            <div id="report-actions" class="report-actions" hidden><button id="report-expand" type="button" class="text-button" aria-expanded="false" aria-controls="report-reader">展开全文 ↓</button></div>
          </div>
        </div>
      </section>
      <details class="state-section"><summary>策略运行状态</summary><div id="states"></div></details>
    </div>
    <dialog id="event-dialog" aria-labelledby="event-title">
      <form id="event-form">
        <div class="section-heading"><h2 id="event-title">记账</h2><button type="button" id="event-cancel" class="text-button">关闭</button></div>
        <p id="event-success" class="entry-success" role="status" hidden></p>
        <fieldset id="event-fields" class="entry-fields">
        <div class="entry-modes" aria-label="记账类别"><button type="button" data-entry-mode="trade">买卖成交</button><button type="button" data-entry-mode="cash">出入金 / 分红</button><button type="button" data-entry-mode="assign">持仓划转</button><button type="button" data-entry-mode="cash_transfer">现金划转</button></div>
        <div class="entry-grid">
          <label>记账类型<select name="side"><option value="buy">买入</option><option value="sell">卖出</option><option value="dividend">现金分红到账</option><option value="deposit">资金转入</option><option value="withdraw">资金转出</option><option value="assign">持仓划转</option><option value="cash_transfer">现金划转</option></select></label>
          <label>发生日期<input name="date" type="date" required></label>
          <label hidden>转出策略<select name="from_strategy" disabled><option value="unassigned">未分配</option><option value="core">多资产配置</option><option value="rotation">跨资产动量</option><option value="quality">质量动量</option></select></label>
          <label data-strategy-field>策略<select name="strategy" required><option value="">请选择策略</option><option value="unassigned">未分配</option><option value="core">多资产配置</option><option value="rotation">跨资产动量</option><option value="quality">质量动量</option></select></label>
          <label data-trade-field>证券代码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" list="entry-securities" autocomplete="off" required><datalist id="entry-securities"></datalist><span id="entry-security" class="field-hint"></span></label>
          <label data-trade-field><span id="entry-qty-label">成交份额</span><input name="qty" type="number" min="1" step="1" required><button type="button" id="entry-all" class="text-button" hidden>全部卖出</button></label>
          <label data-trade-field>成交均价 / 元<input name="price" type="number" min="0.000001" step="any" required></label>
          <label data-trade-field>手续费 / 元<input name="fee" type="number" min="0" step="0.01" value="0" required></label>
          <label data-cash-field hidden>到账 / 转出金额 / 元<input name="amount" type="number" min="0.01" step="0.01" required disabled></label>
        </div>
        <p id="entry-context" class="entry-preview" aria-live="polite"></p>
        <p id="event-preview" class="entry-preview" aria-live="polite" hidden></p>
        <p id="entry-validation" class="warning" role="status" hidden></p>
        </fieldset>
        <p id="event-error" class="warning" role="alert" hidden></p>
        <div class="entry-footer"><button id="event-save" type="submit" class="primary-button">保存记账</button><button id="event-continue" type="submit" class="secondary-button">保存并继续</button><button id="event-refresh" type="button" class="secondary-button" hidden>刷新账户</button></div>
      </form>
    </dialog>
    <dialog id="config-dialog" class="config-dialog" aria-labelledby="config-title">
      <form id="config-form">
        <div class="section-heading"><h2 id="config-title">策略配置</h2><button id="config-cancel" type="button" class="text-button">关闭</button></div>
        <fieldset id="config-fields" class="entry-fields">
        <div class="entry-grid"><label>多资产配置目标占比 / %<input name="core" type="number" min="0" max="100" step="any" placeholder="暂不设置"></label><label>跨资产动量目标占比 / %<input name="rotation" type="number" min="0" max="100" step="any" placeholder="暂不设置"></label><label>质量动量目标占比 / %<input name="quality" type="number" min="0" max="100" step="any" placeholder="暂不设置"></label></div>
        <p class="subtle">以上占比按投资账户总资产计算，合计不超过100%。</p>
        <div class="section-heading"><h3>多资产配置内部配比</h3><button id="config-add" type="button" class="text-button">＋ 添加配置项</button></div>
        <p class="subtle">按指数或用途命名。一个配置项可绑定多个产品，合计市值用于对比目标。仅配置场外基金时，留空主要场内代码。</p>
        <div class="table-wrap"><table class="config-table"><thead><tr><th>配置名称与主要场内代码</th><th>权重 / %</th><th>产品与设置</th><th></th></tr></thead><tbody id="config-assets"></tbody></table></div>
        <p id="config-total" class="entry-preview"></p>
        <details><summary>历史配置</summary><label>选择版本<select id="config-history"></select></label><button id="config-load-history" type="button" class="text-button">使用此版本</button><p class="subtle">保存后生效。</p></details>
        </fieldset>
        <p id="config-error" class="warning" role="alert" hidden></p><button type="submit" class="primary-button" id="config-save">保存配置</button>
      </form>
    </dialog>
    <dialog id="fund-dialog" aria-labelledby="fund-title">
      <form id="fund-form">
        <div class="section-heading"><h2 id="fund-title">场外基金记账</h2><button id="fund-cancel" type="button" class="text-button">关闭</button></div>
        <p id="fund-help" class="subtle"></p>
        <fieldset id="fund-fields" class="entry-fields">
          <p id="fund-quick-summary" class="subtle" hidden></p>
          <div class="entry-grid">
            <label id="fund-code-field">基金代码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
            <label id="fund-record-day-field">记账日期<input name="date" type="date" required></label>
            <label><span id="fund-amount-label">实际扣款 / 元</span><input name="amount" type="number" min="0.01" step="0.01" required></label>
            <label id="fund-qty-field"><span id="fund-qty-label">份额</span><input name="qty" type="number" min="0.000001" max="1000000000" step="0.000001" required></label>
          </div>
          <details id="fund-buy-tools">
            <summary>买入日与费用</summary>
            <div class="entry-grid">
              <label>申购费<select name="fee_kind"><option value="">选择费型</option><option value="none">免申购费</option><option value="rate">按比例</option><option value="fixed">固定金额</option></select></label>
              <label id="fund-fee-field" hidden><span id="fund-fee-label">实际费率 / %</span><input name="fee" type="number" min="0" step="any"></label>
              <label><span id="fund-nav-day-label">买入日</span><input name="nav_date" type="date"></label>
              <label id="fund-nav-field">单位净值 / 元<input name="nav" type="number" min="0.00000001" max="100000000" step="0.00000001"></label>
            </div>
            <button type="button" class="text-button" id="fund-fetch-nav">查该日净值</button>
            <button type="button" class="text-button" id="fund-recalc-qty" hidden>按净值重算份额</button>
          </details>
          <p id="fund-preview" class="entry-preview"></p>
        </fieldset>
        <p id="fund-error" class="warning" role="alert" hidden></p>
        <button type="submit" class="primary-button" id="fund-save">保存记账</button>
      </form>
    </dialog>
    <dialog id="cash-dialog" aria-labelledby="cash-title">
      <form id="cash-form">
        <div class="section-heading"><h2 id="cash-title">分配现金</h2><button id="cash-cancel" type="button" class="text-button">关闭</button></div>
        <fieldset id="cash-fields" class="entry-fields">
        <p class="subtle">账户现金 <strong id="cash-total">—</strong> 元</p>
        <label id="cash-date-label" hidden>发生日期<input name="date" type="date"></label>
        <button id="cash-fill-target" type="button" class="text-button">按全部策略目标再平衡</button>
        <div id="cash-rebalance-preview" hidden></div>
        <div class="entry-grid"><label>多资产配置 / 元<input name="core" type="number" min="0" step="0.01" required></label><label>跨资产动量 / 元<input name="rotation" type="number" min="0" step="0.01" required></label><label>质量动量 / 元<input name="quality" type="number" min="0" step="0.01" required></label></div>
        <p id="cash-remaining" class="entry-preview"></p>
        </fieldset><p id="cash-error" class="warning" role="alert" hidden></p>
        <button type="submit" class="primary-button">确认分配</button>
      </form>
    </dialog>
  </main>
</body>
</html>
